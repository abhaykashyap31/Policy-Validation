spring.application.name=Corporate-Travel
server.port=8080


#db configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Corporate_Travel
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


#logging file
logging.file.name=logs/application.log

logging.level.Booking.GDS.service=DEBUG



# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#need to add ttl for producer

# Consumer Config (Listens to validation results)
spring.kafka.consumer.group-id=travel-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# Consume using this service's DTO instead of the producer's Java class name.
# spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# spring.kafka.consumer.properties.spring.json.use.type.headers=false
# spring.kafka.consumer.properties.spring.json.value.default.type=Booking.GDS.service.Corporate.Travel.Dto.TravelValidationResultEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Custom Topics
kafka.topic.travel-request=travel-validation-requests
kafka.topic.travel-result=travel-validation-results