services:
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
    container_name: travel-planner-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ./infrastructure/config-server
    container_name: travel-planner-config
    restart: unless-stopped
    depends_on:
      - eureka-server
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    ports:
      - "8888:8888"
    volumes:
      - ./infrastructure/config-repo:/config-repo:ro

  travel-planner:
    build: .
    container_name: travel-planner-app
    restart: unless-stopped
    depends_on:
      - eureka-server
      - config-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16
    container_name: travel-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - travel-planner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel-planner-postgres-data: